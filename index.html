<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serendipia 💜</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="manifest" href="manifest.json">
    
    <!-- Força o celular a carregar as duas fotos de fundo instantaneamente -->
    <link rel="preload" href="IMG_1191.jpeg" as="image">
    <link rel="preload" href="IMG_0604.jpeg" as="image">
</head>
<body>

    <!-- TELA 1: SENHA -->
    <div id="tela-senha" class="tela">
        <div class="conteudo-login">
            <h2>Digite a senha para entrar:</h2>
            <input type="number" pattern="[0-9]*" inputmode="numeric" id="campo-senha" placeholder="Senha...">
            <button onclick="verificarSenha()">Entrar</button>
        </div>
    </div>

    <!-- TELA 2: MENSAGEM DO KM -->
    <div id="tela-km" class="tela escondido">
        <div class="conteudo-login">
            <img src="IMG_1191.jpeg" alt="Foto KM" style="max-width: 85%; border-radius: 10px; margin-bottom: 15px;">
            <h1 class="mensagem-principal" style="font-size: 20px; line-height: 1.5; padding: 0 10px;">
                Que Deus te acompanhe em cada quilômetro… Onde quer que você vá, pilote com cuidado, e saiba que nós te amamos!
            </h1>
            <br>
            <button onclick="irParaAperteComecar()" style="font-size: 24px; padding: 10px 20px;">➔</button>
        </div>
    </div>

    <!-- TELA 3: TELA DA MÚSICA -->
    <div id="tela-principal" class="tela escondido">
        <div class="conteudo-login">
            <img src="IMG_0604.jpeg" alt="Foto Iniciar" style="max-width: 85%; border-radius: 10px; margin-bottom: 15px;">
            <h1 class="mensagem-principal">serendipia 💜</h1>
            <audio id="musica" src="AUDIO-2026-06-11-22-35-47.mp3" preload="auto" loop></audio>
            <br>
            <button id="btn-passar" onclick="iniciarLoop()">Clique para Iniciar</button>
        </div>
    </div>

    <!-- TELA 4: LOOP DE FOTOS -->
    <div id="tela-fotos" class="tela escondido">
        <img id="slide" src="" alt="Loop de Fotos">
        <div id="mensagem-final" class="conteudo-login escondido">
            <h1 style="font-size: 24px; margin: 0; line-height: 1.5;">Sim! eu amo muito você Renato💕</h1>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Pronto!'))
          .catch((err) => console.log('Erro:', err));
      }
    </script>
</body>
</html>
