<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serendipia 💜</title>
    <!-- O código abaixo força o Safari a limpar o histórico antigo na hora -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <!-- TELA 1: SENHA -->
    <div id="tela-senha" class="tela">
        <div class="conteudo-login">
            <h2>Digite a senha para entrar:</h2>
            <input type="password" id="campo-senha" placeholder="Senha...">
            <button onclick="verificarSenha()">Entrar</button>
        </div>
    </div>

    <!-- TELA 2: TELA DA MÚSICA (SEM A PALAVRA APORTOU) -->
    <div id="tela-principal" class="tela escondido">
        <div class="conteudo-login">
            <h1 class="mensagem-principal">serendipia 💜</h1>
            <audio id="musica" src="AUDIO-2026-06-11-22-35-47.mp3" preload="auto" loop></audio>
            <br>
            <button id="btn-passar" onclick="iniciarLoop()">Clique para Iniciar</button>
        </div>
    </div>

    <!-- TELA 3: LOOP DE FOTOS E MENSAGEM SURPRESA -->
    <div id="tela-fotos" class="tela escondido">
        <img id="slide" src="" alt="Loop de Fotos">
        <!-- Caixinha centralizada com a mensagem para o Renato -->
        <div id="mensagem-final" class="conteudo-login escondido">
            <h1 style="font-size: 24px; margin: 0; line-height: 1.5;">Sim! eu amo muito você Renato💕</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
